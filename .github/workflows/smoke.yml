name: smoke

on:
  push:
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: ${{ matrix.python }}
      # setup-uv exports VIRTUAL_ENV pointing at a workspace-root virtualenv,
      # and `uv pip install` honours it in preference to a `.venv` in the
      # current directory. Under `working-directory: engine` that silently
      # installs into the root venv while the checks below invoke
      # ./engine/.venv/bin/motoko, so every leg fails with exit 127.
      # Target the interpreter explicitly instead of relying on discovery.
      - name: Install engine and smoke-check
        working-directory: engine
        run: |
          uv venv "$PWD/.venv"
          uv pip install --python "$PWD/.venv/bin/python" .
          ./.venv/bin/motoko --help
          ./.venv/bin/motoko doctor
      # The rule packs are package data. If they ever stop shipping, the
      # engine still imports and `doctor` still passes while generating zero
      # hypotheses, so assert the count from the INSTALLED tree explicitly.
      #
      # `-P` matters: this step runs with working-directory `engine`, and
      # without it Python prepends that cwd to sys.path, so `import core`
      # would pick up the SOURCE tree and the assertion could not fail even
      # if the wheel shipped no rules. The site-packages check below makes
      # that self-enforcing.
      - name: Assert the rule packs are installed
        working-directory: engine
        run: |
          ./.venv/bin/python -P -c "
          from core import util
          from core.hypothesis_engine import HypothesisEngine
          d = util.default_rules_dir()
          n = HypothesisEngine(d).rule_count()
          print('rules_dir:', d)
          print('rule_count:', n)
          assert 'site-packages' in str(d), f'resolved the source tree, not the install: {d}'
          # Guard against accidentally omitting the bundled rule packs.
          assert n >= 31, f'expected >=31 bundled rules, got {n}'
          "
      - name: Assert no build artifacts are tracked
        run: |
          ! git ls-files | grep -qE '(^|/)(build|dist)/|\.egg-info/'

  policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Public-tree language policy (AGENTS.md): the flagged network-forwarding
      # term must not appear outside LICENSE — in file contents (text or
      # binary), in tracked file names, or anywhere under engine/. The pattern
      # is assembled from parts so this file does not itself carry the term.
      # A scan that cannot complete fails the job instead of passing it.
      - name: Check the public-tree language policy
        run: |
          pat="pr""oxy"
          files=$(git ls-files) || { echo "::error::git ls-files failed"; exit 1; }

          # The content scan exempts LICENSE by basename, so assert the
          # exemption can only ever hit the root verbatim text: exactly one
          # LICENSE file may exist outside .git, and it must be the root one.
          # `find` enumerates raw bytes — git's text listing C-quotes unusual
          # paths (core.quotePath), which would hide a nested LICENSE from a
          # line-anchored grep while the basename exemption still applied.
          lrc=0
          lic=$(find . -path ./.git -prune -o -name LICENSE -type f -print) || lrc=$?
          if [ "$lrc" -ne 0 ]; then
            echo "::error::LICENSE enumeration failed (find exit $lrc); the scan exemption assumes the root file"
            exit 1
          fi
          if [ "$lic" != "./LICENSE" ]; then
            echo "::error::expected exactly one LICENSE (the root file); found: $lic"
            exit 1
          fi

          # Content scan: every file under the tree except .git and the
          # verbatim LICENSE. No -I: a binary match is still a match.
          rc=0
          grep -rniF --exclude-dir=.git --exclude=LICENSE -e "$pat" . || rc=$?
          if [ "$rc" -eq 0 ]; then
            echo "::error::flagged term found in file contents outside LICENSE (see AGENTS.md)"
            exit 1
          fi
          if [ "$rc" -ne 1 ]; then
            echo "::error::content scan failed (grep exit $rc); refusing to pass on an incomplete scan"
            exit 1
          fi

          # Name scan: tracked paths only. No pipeline: a two-stage pipeline
          # reports its last stage's exit status (1 = no match) and masks a
          # left-stage failure, which would read as "no match".
          nrc=0
          names=$(grep -iF -e "$pat" <<< "$files") || nrc=$?
          if [ "$nrc" -eq 0 ]; then
            printf '%s\n' "$names"
            echo "::error::flagged term found in tracked file names (see AGENTS.md)"
            exit 1
          fi
          if [ "$nrc" -ne 1 ]; then
            echo "::error::name scan failed (grep exit $nrc); refusing to pass on an incomplete scan"
            exit 1
          fi
