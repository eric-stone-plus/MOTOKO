name: smoke

on:
  push:
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: ${{ matrix.python }}
      # setup-uv exports VIRTUAL_ENV pointing at a workspace-root virtualenv,
      # and `uv pip install` honours it in preference to a `.venv` in the
      # current directory. Under `working-directory: engine` that silently
      # installs into the root venv while the checks below invoke
      # ./engine/.venv/bin/motoko, so every leg fails with exit 127.
      # Target the interpreter explicitly instead of relying on discovery.
      - name: Install engine and smoke-check
        working-directory: engine
        run: |
          uv venv "$PWD/.venv"
          uv pip install --python "$PWD/.venv/bin/python" .
          ./.venv/bin/motoko --help
          ./.venv/bin/motoko doctor
      # The rule packs are package data. If they ever stop shipping, the
      # engine still imports and `doctor` still passes while generating zero
      # hypotheses, so assert the count from the INSTALLED tree explicitly.
      #
      # `-P` matters: this step runs with working-directory `engine`, and
      # without it Python prepends that cwd to sys.path, so `import core`
      # would pick up the SOURCE tree and the assertion could not fail even
      # if the wheel shipped no rules. The site-packages check below makes
      # that self-enforcing.
      - name: Assert the rule packs are installed
        working-directory: engine
        run: |
          ./.venv/bin/python -P -c "
          from core import util
          from core.hypothesis_engine import HypothesisEngine
          d = util.default_rules_dir()
          n = HypothesisEngine(d).rule_count()
          print('rules_dir:', d)
          print('rule_count:', n)
          assert 'site-packages' in str(d), f'resolved the source tree, not the install: {d}'
          # Guard against accidentally omitting the bundled rule packs.
          assert n >= 31, f'expected >=31 bundled rules, got {n}'
          "
      - name: Assert no build artifacts are tracked
        run: |
          ! git ls-files | grep -qE '(^|/)(build|dist)/|\.egg-info/'

  policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Public-tree language policy (AGENTS.md): the flagged network-forwarding
      # term must not appear outside LICENSE. The pattern is assembled from
      # parts so this file does not itself carry the term. engine/ is a
      # one-way export and is checked in its source tree, so this job covers
      # the files maintained here.
      - name: Check the public-tree language policy
        run: |
          pat="pr""oxy"
          if grep -rIni --exclude-dir=.git --exclude-dir=engine --exclude=LICENSE -e "$pat" .; then
            echo "::error::flagged term found outside LICENSE (see AGENTS.md)"
            exit 1
          fi
