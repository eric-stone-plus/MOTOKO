[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "core-engine"
# The authoritative version anchor is the git commit, which `motoko seal`
# records in every engagement manifest; this is the human-readable label.
version = "0.7.0"
description = "MOTOKO attack-graph orchestration engine"
requires-python = ">=3.11"
# Reproducibility claim: the engine is stdlib-only. Runtime behavior
# depends on the Python version and the pinned tools, never on pip deps.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]   # no test suite ships in this tree; add tests/ first

[project.scripts]
motoko = "core.cli:main"

[tool.setuptools.packages.find]
include = ["core*"]

# The rule packs ship inside the package so an installed engine resolves them
# the same way a source checkout does (core.default_rules_dir()).
[tool.setuptools.package-data]
core = ["rules/*/*.json"]

