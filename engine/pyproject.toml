[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "motoko-engine"
# The real version anchor is the git commit (recorded in every seal
# manifest and publish log); this is the R7-era human label.
version = "0.7.0"
description = "MOTOKO attack-graph orchestration engine (private runtime)"
requires-python = ">=3.11"
# Reproducibility claim: the engine is stdlib-only. Runtime behavior
# depends on the Python version and the pinned tools, never on pip deps.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
motoko = "motoko.cli:main"

[tool.setuptools.packages.find]
include = ["motoko*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
