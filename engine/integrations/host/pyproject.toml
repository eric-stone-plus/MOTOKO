[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "motoko-host"
version = "1.1.0"
description = "Bounded local and SSH stdio client for MOTOKO hosts"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
motoko-host = "motoko_host.cli:main"

[tool.setuptools.packages.find]
include = ["motoko_host*"]
